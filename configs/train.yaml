seed: 42
model_name: microsoft/deberta-v3-xsmall
output_dir: outputs/deberta-v3-xsmall-pii

data:
  raw_dir: data/raw
  processed_dir: data/processed
  # training documents per source (English only). Total = 50k.
  # If a source has fewer English docs than its cap, the shortfall is filled from the others.
  train_caps: {nemotron: 20000, gretel: 15000, ai4privacy: 15000}
  val_per_source: 1000     # held out from train split, on top of train_caps
  test_per_source: 2000    # from each source's official test/validation split

tokenize:                 # OpenMed: max length 384, first sub-token labelling
  max_length: 384
  stride: 96
  label_all_tokens: false

train:
  learning_rate: 5.0e-5
  num_train_epochs: 3
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  eval_steps: 2000
  save_steps: 2000
  logging_steps: 100
  save_total_limit: 2
