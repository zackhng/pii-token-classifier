# source -> {source_label: TARGET}. Unlisted labels become O.
#   O        : look-alikes we deliberately teach as "not PII" (amounts, ordinary dates, PIN,
#              CVV, SWIFT/routing codes, ...) - leave them unlisted.
#   IGNORE   : loss-masked (-100); only for spans that are genuinely ambiguous under our
#              definitions (national ID, fax, passport/ID card, crypto wallets).
#   DATE_CUE : a date that becomes DOB when a birth cue (birth/born/DOB) precedes it on the
#              same line, otherwise O.
entities: [PERSON, BUSINESS, ADDRESS, DOB, ACCOUNT, PHONE, EMAIL, TIN]

# raw labels recorded as look-alike negatives (by group) for eval_confusion.py
negatives:
  amount: [AMOUNT, BALANCE, SALARY]
  currency: [CURRENCY]
  date: [date, DATE]          # DATE only when DATE_CUE resolves to O
  code: [pin, cvv, swift_bic, bank_routing_number, account_pin, credit_card_security_code,
         swift_bic_code, BIC, PIN, CREDITCARDCVV, CREDITCARDEXPIRY]

