# Account number formats per jurisdiction and institution, for generated training / test data
# (v5, src/ml_values.py). Every format here comes from a cited public source - no invented shapes.
#
# pattern   one printed layout: '#' digit, 'A' capital letter, 'X' capital letter or digit, anything
#           else literal (separators, fixed prefixes such as "IN" or "1681"); [XYZ] = one of
#           those characters, so a literal A or X is written [A] / [X] (e.g. "[A][E]" for a UAE IBAN);
#           separators appear only where a source prints them. Several patterns =
#           layouts the sources give (lengths that vary by product / vintage).
# plain     true: also rendered with the separators removed (transfer forms and payment
#           instructions ask for the digits only, per the bank-code / IBG guides cited below)
# status    verified  two sources agree, or one official/primary source
#           partial   one secondary source, a single sample, or sources disagree (lower weight)
#           unverified  recorded for the research trail only - NEVER sampled
# kind      bank | private_bank | custodian | broker | depository | iban
# names     how the institution is written in documents (first = default); BUSINESS spans
#
# Checked 2026-10-08. Formats sources disagree on are ranges (several patterns) with every source.

checked: 2026-10-08

