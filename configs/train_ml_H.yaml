# v5 grid cell H: XLM-R base, encoder frozen, only the token-classification head trains.
# Everything else = train_ml.yaml (v4.1 recipe). LR from the per-method sweep (run_v5_stage2.sh).
seed: 42
model_name: xlm-roberta-base
output_dir: outputs/xlmr-base-pii-ml-H-v5data

data:
  multilingual: true
  processed_dir: data/processed
  train_split: ml_train
  val_split: ml_val

tokenize:
  max_length: 384
  stride: 96
  label_all_tokens: false
  visible_breaks: true
  script_boundaries: true      # CJK / Thai word boundaries + lone-"▁" offset fix (Phase 0)

train:
  learning_rate: 1.0e-3          # head only (sweep: 3e-4 / 1e-3 / 3e-3)
  num_train_epochs: 3
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  eval_steps: 4000
  save_steps: 4000
  logging_steps: 200
  save_total_limit: 2
  metric_for_best_model: macro_f1   # mean F1 over the 12 languages of ml_val
  freeze: {mode: head_only}
