patterns:
  before:
    - "{c} nasabah adalah {v}"
    - "{c} sudah diperbarui menjadi {v}"
    - "mohon ubah {c} menjadi {v}"
    - "setelah diverifikasi, {c} adalah {v}"
    - "{c} yang diberikan nasabah adalah {v}"
    - "{c} baru adalah {v}, mohon dicatat"
    - "mohon konfirmasi {c} {v} ke nasabah"
    - "bulan lalu {c} berubah menjadi {v}"
    - "di dokumen, {c} tertulis {v}"
  after:
    - "{v} adalah {c} di catatan kami"
    - "{v} ({c})"
    - "{v} diberikan sebagai {c}"
    - "{v}, yaitu {c} di sistem"
    - "{v} - {c}, terverifikasi"
    - "{v} tetap menjadi {c} untuk saat ini"
    - "{v} terdaftar sebagai {c}"
    - "{v} [{c}]"
    - "gunakan {v} sebagai {c}"
  list:
    - "{c}: {vs}"
    - "{c} yang tercatat adalah {vs}"
    - "nasabah melaporkan {c} {vs}"
    - "{c} - {vs}"
    - "kami memegang {c} {vs}"
    - "{c} yang direview: {vs}"
    - "{c} ({vs})"
    - "{c} meliputi {vs}"
    - "{c} masing-masing {vs}"
  bracket:
    - "{a} ({c}: {v})"
    - "{a} - {c} {v}"
    - "{a} [{c} {v}]"
    - "{a}, {c} {v},"
    - "{a} (dengan {c} {v})"
    - "{a} / {c} {v}"
    - "{a} ({c} {v})"
    - "{a}; {c}: {v}"
    - "{a} - {c}: {v}"
  spoken:
    - "{c} saya {v}"
    - "iya, {v}"
    - "{c}? {v}"
    - "pakai {v} saja, itu {c} saya"
    - "harusnya {v}"
    - "eh, kayaknya {v}"
    - "{v}, yang itu"
    - "tahun lalu saya ganti ke {v}"
    - "tolong catat {v} sebagai {c} saya"
ask:
  - "Boleh dikonfirmasi {c} Bapak/Ibu?"
  - "Lalu {c}-nya?"
  - "{c} yang mana yang dipakai?"
  - "Boleh saya minta {c}?"
  - "{c} saat ini apa ya?"
  - "Saya cek dulu {c}-nya."
  - "Berapa {c}-nya?"
  - "Apakah {c} masih sama?"
  - "Untuk verifikasi, {c} Bapak/Ibu?"

