patterns:
  before:
    - "お客様の{c}は{v}です"
    - "{c}を{v}に更新しました"
    - "{c}を{v}へ変更してください"
    - "確認の結果、{c}は{v}"
    - "ご申告の{c}は{v}"
    - "新しい{c}は{v}です。ご留意ください"
    - "お客様に{c}{v}をご確認ください"
    - "先月{c}が{v}に変わりました"
    - "書類上の{c}は{v}と記載"
  after:
    - "{v}が登録済みの{c}です"
    - "{v}（{c}）"
    - "{v}をお客様の{c}として受付"
    - "{v}、システム上の{c}"
    - "{v}：{c}、確認済み"
    - "{v}を当面の{c}とする"
    - "{v}は{c}として登録"
    - "{v}【{c}】"
    - "{v}を{c}としてご使用ください"
  list:
    - "{c}：{vs}"
    - "登録されている{c}は{vs}"
    - "お客様申告の{c}は{vs}"
    - "{c}／{vs}"
    - "当社保有の{c}：{vs}"
    - "確認済みの{c}：{vs}"
    - "{c}（{vs}）"
    - "{c}には{vs}が含まれます"
    - "{c}はそれぞれ{vs}"
  bracket:
    - "{a}（{c}：{v}）"
    - "{a}／{c}{v}"
    - "{a}【{c}{v}】"
    - "{a}、{c}{v}、"
    - "{a}（{c}は{v}）"
    - "{a}・{c}{v}"
    - "{a}（{c}{v}）"
    - "{a}；{c}：{v}"
    - "{a}－{c}：{v}"
  spoken:
    - "私の{c}は{v}です"
    - "はい、{v}です"
    - "{c}ですか？{v}です"
    - "{v}でお願いします、それが{c}です"
    - "{v}のはずです"
    - "ええと、{v}だったと思います"
    - "{v}、それです"
    - "去年{v}に変えました"
    - "{v}を{c}として控えてください"
ask:
  - "{c}をお伺いしてもよろしいでしょうか。"
  - "念のため{c}をご確認ください。"
  - "{c}はどちらをお使いですか。"
  - "{c}を教えていただけますか。"
  - "現在の{c}は何でしょうか。"
  - "{c}を確認させていただきます。"
  - "{c}はいくつでしょうか。"
  - "{c}はお変わりありませんか。"
  - "ご本人確認のため、{c}をお願いします。"

narrative:
  PERSON: ["{v}様より今朝、解約のご相談がありました。", "支店で{v}様と運用方針を協議。", "{v}様が来週書類に署名予定。", "資産管理会社は{v}様が運営。", "{v}様より手数料見直しのご依頼。", "既存顧客の{v}様からのご紹介。"]
  BUSINESS: ["{v}に十二年勤務後、退職。", "配当は{v}からのもの。", "資産の大半は{v}の株式。", "昨年{v}の持分を売却。", "現在{v}の顧問を務める。", "保証は{v}が発行。"]
  ADDRESS: ["{v}にてお客様と面談。", "来月より報告書は{v}へ送付。", "{v}の物件は2021年に売却済み。", "2015年から{v}に居住。", "書類を{v}へ発送済み。", "三月に{v}へ転居予定。"]
  DOB: ["{v}にペナンで出生。", "{v}生まれで、まもなく六十歳。", "{v}生まれ、現在は退職。", "旅券上の生年月日は{v}。", "{v}生まれのシンガポール国籍。", "旅券によると誕生日は{v}。"]
  ACCOUNT: ["利金は{v}へ入金してください。", "解約代金は{v}へ支払済み。", "振替完了後に{v}を解約。", "追証は{v}に計上。", "金曜日に{v}から出金。", "配当は四半期ごとに{v}へ集約。"]
  PHONE: ["昼食後に{v}へ折り返し。", "{v}で連絡可能。", "SMSは{v}から。", "代表番号が話し中なら{v}へ。", "お客様は{v}から架電。", "新しい携帯は{v}。"]
  EMAIL: ["提案書を{v}へ送付。", "報告書は{v}宛て。", "依頼は{v}から届いた。", "条件書は{v}にも写しを。", "{v}から連絡が来る。", "金曜までに{v}へ返信。"]
  TIN: ["CRS報告は{v}で行う。", "W-8BENには{v}を記載。", "税務申告は{v}で行う。", "自己申告書に{v}を記載。", "源泉徴収は{v}に適用。", "支払調書には{v}を使用。"]

