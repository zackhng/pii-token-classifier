# ml_wm spec, Simplified Chinese (mainland / SG private-banking usage). Lists split index % 3:
# 0 train, 1 dev, 2 test. Placeholders: {c} cue, {v} value, {vs} values, {a} anchor entity.
lang: zh-Hans
field_seps: ["：", "：", ": ", "　", "：", "－"]
and: "和"
comma: "、"
period: "。"
sentence_join: "；"
speakers: {rm: 客户经理, client: 客户}
table_headers: [[项目, 内容], [字段, 信息], [项目, 详情], [栏目, 内容], [项目, 说明], [字段, 内容]]
table_note: [备注, 说明, 附注, 备注, 情况, 补充]

