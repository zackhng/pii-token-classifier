patterns:
  before:
    - "客户的{c}为{v}"
    - "{c}已更新为{v}"
    - "请将{c}改为{v}"
    - "经核实，{c}是{v}"
    - "客户提供的{c}是{v}"
    - "新的{c}为{v}，请知悉"
    - "请与客户确认{c}{v}"
    - "上月{c}变更为{v}"
    - "证件上的{c}显示为{v}"
  after:
    - "{v}是我们登记的{c}"
    - "{v}（{c}）"
    - "{v}为客户提供的{c}"
    - "{v}，即系统中的{c}"
    - "{v}——{c}，已核实"
    - "{v}暂时仍作为{c}"
    - "{v}登记为其{c}"
    - "{v}【{c}】"
    - "{v}应作为{c}使用"
  list:
    - "{c}：{vs}"
    - "登记的{c}有{vs}"
    - "客户申报的{c}为{vs}"
    - "{c}－{vs}"
    - "我们持有的{c}：{vs}"
    - "已复核{c}：{vs}"
    - "{c}（{vs}）"
    - "{c}包括{vs}"
    - "{c}分别是{vs}"
  bracket:
    - "{a}（{c}：{v}）"
    - "{a}－{c}{v}"
    - "{a}【{c}{v}】"
    - "{a}，{c}{v}，"
    - "{a}（{c}为{v}）"
    - "{a}／{c}{v}"
    - "{a}（{c}{v}）"
    - "{a}；{c}：{v}"
    - "{a}－{c}：{v}"
  spoken:
    - "我的{c}是{v}"
    - "对，是{v}"
    - "{c}吗？{v}"
    - "用{v}吧，那是我的{c}"
    - "应该是{v}"
    - "嗯，好像是{v}"
    - "{v}，就是这个"
    - "去年我改成{v}了"
    - "请记下{v}，这是我的{c}"

ask:
  - "请问您的{c}是？"
  - "麻烦确认一下{c}。"
  - "{c}用哪个？"
  - "能告诉我{c}吗？"
  - "现在的{c}是什么？"
  - "我核对一下{c}。"
  - "{c}是多少？"
  - "{c}还是原来的吗？"
  - "为了核实身份，您的{c}是？"

narrative:
  PERSON:
    - "{v}今天上午来电询问赎回事宜。"
    - "我们在分行与{v}讨论了委托事项。"
    - "{v}下周签署文件。"
    - "家族办公室由{v}负责。"
    - "{v}要求我们复核费用。"
    - "由老客户{v}介绍。"
  BUSINESS:
    - "她在{v}工作了十二年后退休。"
    - "这笔分红来自{v}。"
    - "大部分财富集中在{v}。"
    - "客户去年出售了{v}的股份。"
    - "他目前为{v}提供顾问服务。"
    - "保函由{v}出具。"
  ADDRESS:
    - "我们到{v}拜访了客户。"
    - "下月起对账单将寄往{v}。"
    - "位于{v}的房产已于2021年出售。"
    - "他自2015年起住在{v}。"
    - "文件已快递至{v}。"
    - "她三月将搬到{v}。"
  DOB:
    - "她于{v}出生于槟城。"
    - "他生于{v}，快六十岁了。"
    - "客户生于{v}，现已退休。"
    - "护照显示其生于{v}。"
    - "客户{v}出生，为新加坡公民。"
    - "根据护照，她的生日是{v}。"
  ACCOUNT:
    - "请将票息打入{v}。"
    - "赎回款已付至{v}。"
    - "转账完成后注销{v}。"
    - "追加保证金记在{v}下。"
    - "资金已于周五从{v}转出。"
    - "股息每季度归集至{v}。"
  PHONE:
    - "午饭后请回电{v}。"
    - "可以拨打{v}联系他。"
    - "短信来自{v}。"
    - "办公电话占线时请打{v}。"
    - "客户从{v}来电。"
    - "她的新手机号可打{v}。"
  EMAIL:
    - "请将方案发送至{v}。"
    - "对账单寄往{v}。"
    - "该申请来自{v}。"
    - "条款书请抄送{v}。"
    - "他使用{v}发信。"
    - "请于周五前回复{v}。"
  TIN:
    - "CRS申报使用{v}。"
    - "W-8BEN上填写的是{v}。"
    - "纳税申报以{v}办理。"
    - "自我声明表列明{v}。"
    - "预扣税适用于{v}。"
    - "完税凭证请使用{v}。"

