fillers:
  kyc: ["风险等级：中，最近筛查于{DATE}。", "筛查编号{REF}。", "预计首笔入金{AMOUNT}。", "账单上只看得清邮编{POSTCODE}。", "复核日期{DATE}。", "案件{REF}已结案。"]
  sow: ["流动资产约{AMOUNT}。", "交割日为{DATE}。", "托管编号{REF}。", "所得{AMOUNT}已再投资。", "债券{ISIN}于{DATE}到期。", "收到分红{AMOUNT}。"]
