patterns:
  before:
    - "고객의 {c}는 {v}입니다"
    - "{c}를 {v}로 변경했습니다"
    - "{c}를 {v}로 수정해 주세요"
    - "확인 결과 {c}는 {v}"
    - "고객이 알려준 {c}는 {v}"
    - "새 {c}는 {v}이니 참고 바랍니다"
    - "고객에게 {c} {v}를 확인해 주세요"
    - "지난달 {c}가 {v}로 바뀌었습니다"
    - "서류상 {c}는 {v}로 기재"
  after:
    - "{v}이 등록된 {c}입니다"
    - "{v}({c})"
    - "{v}을 고객의 {c}로 접수"
    - "{v}, 시스템상 {c}"
    - "{v} - {c}, 확인 완료"
    - "{v}을 당분간 {c}로 사용"
    - "{v}은 {c}로 등록됨"
    - "{v} [{c}]"
    - "{v}을 {c}로 사용해 주세요"
  list:
    - "{c}: {vs}"
    - "등록된 {c}는 {vs}"
    - "고객이 신고한 {c}는 {vs}"
    - "{c} - {vs}"
    - "당사 보유 {c}: {vs}"
    - "점검한 {c}: {vs}"
    - "{c}({vs})"
    - "{c}에는 {vs}가 포함됨"
    - "{c}는 각각 {vs}"
  bracket:
    - "{a}({c}: {v})"
    - "{a} / {c} {v}"
    - "{a} [{c} {v}]"
    - "{a}, {c} {v},"
    - "{a}({c}는 {v})"
    - "{a} · {c} {v}"
    - "{a}({c} {v})"
    - "{a}; {c}: {v}"
    - "{a} - {c}: {v}"
  spoken:
    - "제 {c}는 {v}예요"
    - "네, {v}입니다"
    - "{c}요? {v}요"
    - "{v}로 해 주세요, 그게 제 {c}예요"
    - "{v}일 거예요"
    - "음, {v}였던 것 같아요"
    - "{v}, 그거예요"
    - "작년에 {v}로 바꿨어요"
    - "{v}를 {c}로 적어 주세요"
ask:
  - "{c} 확인 부탁드립니다."
  - "혹시 {c}가 어떻게 되세요?"
  - "{c}는 어느 걸로 할까요?"
  - "{c} 말씀해 주시겠어요?"
  - "지금 {c}가 뭔가요?"
  - "{c}를 확인해 보겠습니다."
  - "{c}가 얼마인가요?"
  - "{c}는 그대로인가요?"
  - "본인 확인을 위해 {c} 부탁드립니다."

