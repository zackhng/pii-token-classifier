    - "noong isang buwan napalitan ang {c} ng {v}"
    - "sa dokumento, ang {c} ay {v}"
  after:
    - "{v} ang {c} sa aming rekord"
    - "{v} ({c})"
    - "{v} ang ibinigay bilang {c}"
    - "{v}, ang {c} sa sistema"
    - "{v} - {c}, verified"
    - "{v} pa rin ang {c} sa ngayon"
    - "{v} ay nakarehistro bilang {c}"
    - "{v} [{c}]"
    - "gamitin ang {v} bilang {c}"
  list:
    - "{c}: {vs}"
    - "ang {c} sa rekord ay {vs}"
    - "idineklara ng kliyente ang {c} na {vs}"
    - "{c} - {vs}"
    - "hawak namin ang {c} na {vs}"
    - "{c} na sinuri: {vs}"
    - "{c} ({vs})"
    - "kasama sa {c} ang {vs}"
    - "ang {c} ay {vs}"
  bracket:
    - "{a} ({c}: {v})"
    - "{a} - {c} {v}"
    - "{a} [{c} {v}]"
    - "{a}, {c} {v},"
    - "{a} (may {c} na {v})"
    - "{a} / {c} {v}"
    - "{a} ({c} {v})"
    - "{a}; {c}: {v}"
    - "{a} - {c}: {v}"
  spoken:
    - "ang {c} ko ay {v}"
    - "opo, {v}"
    - "{c}? {v} po"
    - "gamitin n'yo po ang {v}, 'yan ang {c} ko"
    - "dapat {v} po"
    - "ah, {v} yata"
    - "{v}, 'yon po"
    - "pinalitan ko na ng {v} noong isang taon"
    - "pakilista po ang {v} bilang {c} ko"
