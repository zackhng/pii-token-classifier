patterns:
  before:
    - "客戶的{c}為{v}"
    - "{c}已更新為{v}"
    - "請將{c}更改為{v}"
    - "經核實，{c}係{v}"
    - "客戶提供的{c}是{v}"
    - "新的{c}為{v}，敬請留意"
    - "請與客戶確認{c}{v}"
    - "上月{c}改為{v}"
    - "證件上的{c}顯示為{v}"
  after:
    - "{v}是我們登記的{c}"
    - "{v}（{c}）"
    - "{v}為客戶提供的{c}"
    - "{v}，即系統中的{c}"
    - "{v}——{c}，已核實"
    - "{v}暫時仍作{c}"
    - "{v}登記為其{c}"
    - "{v}【{c}】"
    - "{v}應作為{c}使用"
  list:
    - "{c}：{vs}"
    - "登記的{c}有{vs}"
    - "客戶申報的{c}為{vs}"
    - "{c}－{vs}"
    - "我們持有的{c}：{vs}"
    - "已覆核{c}：{vs}"
    - "{c}（{vs}）"
    - "{c}包括{vs}"
    - "{c}分別為{vs}"
  bracket:
    - "{a}（{c}：{v}）"
    - "{a}－{c}{v}"
    - "{a}【{c}{v}】"
    - "{a}，{c}{v}，"
    - "{a}（{c}為{v}）"
    - "{a}／{c}{v}"
    - "{a}（{c}{v}）"
    - "{a}；{c}：{v}"
    - "{a}－{c}：{v}"
  spoken:
    - "我嘅{c}係{v}"
    - "係，係{v}"
    - "{c}？{v}"
    - "用{v}啦，嗰個係我嘅{c}"
    - "應該係{v}"
    - "嗯，好似係{v}"
    - "{v}，就係呢個"
    - "舊年我改咗做{v}"
    - "請記低{v}，係我嘅{c}"
ask:
  - "請問您的{c}是？"
  - "麻煩確認一下{c}。"
  - "{c}用邊個？"
  - "可唔可以話我知{c}？"
  - "而家嘅{c}係咩？"
  - "我核對一下{c}。"
  - "{c}是多少？"
  - "{c}仲係唔係舊嗰個？"
  - "為核實身分，您的{c}是？"

